<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Craftly — CRM для фрилансера</title>
  <meta name="description" content="Craftly — мини-CRM для фрилансера: клиенты, заказы, деньги." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Progress bar -->
  <div id="progress" class="progress" aria-hidden="true"><div class="progress__bar"></div></div>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="#dashboard" class="brand" data-nav="dashboard" aria-label="Craftly">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2 L20 7 V17 L12 22 L4 17 V7 Z"/>
          <path d="M12 22 V12"/>
          <path d="M20 7 L12 12 L4 7"/>
        </svg>
        <span class="brand__text">Craftly</span>
      </a>

      <nav class="nav" aria-label="Основная навигация">
        <button class="nav__link" data-nav="dashboard" type="button">Дашборд</button>
        <button class="nav__link" data-nav="orders" type="button">Заказы</button>
        <button class="nav__link" data-nav="clients" type="button">Клиенты</button>
        <button class="nav__link" data-nav="finance" type="button">Финансы</button>
        <button class="nav__link" data-nav="settings" type="button">Настройки</button>
      </nav>

      <div class="topbar__actions">
        <button class="icon-btn" id="searchBtn" type="button" aria-label="Поиск (/)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21 L16.65 16.65"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Меню">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6 H21"/><path d="M3 12 H21"/><path d="M3 18 H21"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <!-- Mobile tab bar -->
  <nav class="tabbar" aria-label="Мобильная навигация">
    <button class="tabbar__link" data-nav="dashboard" type="button" aria-label="Дашборд">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    </button>
    <button class="tabbar__link" data-nav="orders" type="button" aria-label="Заказы">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 H15 L17 6 H7 Z"/><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M9 12 H15"/></svg>
    </button>
    <button class="tabbar__link" data-nav="clients" type="button" aria-label="Клиенты">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 17 8 15 12 15 C16 15 20 17 20 21"/></svg>
    </button>
    <button class="tabbar__link" data-nav="finance" type="button" aria-label="Финансы">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 L9 11 L13 15 L21 7"/><path d="M15 7 H21 V13"/></svg>
    </button>
    <button class="tabbar__link" data-nav="settings" type="button" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
  </nav>

  <!-- Modals root -->
  <div id="modals" class="modals" aria-live="polite"></div>

  <!-- Toasts -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

</body>
</html>
